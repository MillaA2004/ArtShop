<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="shortcut icon" type="x-icon" href="icons/color-palette.png">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://kit.fontawesome.com/f634b05fd0.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="css/nav.css">
    <link rel="stylesheet" href="css/body.css">
    <link rel="stylesheet" href="css/footer.css">
    <link rel="stylesheet" href="css/tutorials.css">
    <link rel="stylesheet" href="css/sidebar.css">
    <link rel="stylesheet" href="css/gallery.css">
    <title>Artsy</title>
    <link rel="stylesheet" href="css/dark-mode.css">
</head>
<body>
    <header>
        <nav>
            <ul>
                <li><a href="index.html">Store</a></li>
                <li><a href="signup.html">Account</a></li>
                <li><a href="aboutus.html">About us</a></li>  
                <li><a href="cart.html"><i class="fa fa-shopping-cart"></i></a></li>
            </ul>
        </nav> 
        <div class="logo">
            <a href="artsy.html">
                <img src="icons/color-palette.png"alt="logo">
            </a>
        </div>
    </header>

   
    <div id="sidenav" class="sidenav">
        <div class="bar">
            <a href="photoshop.html" id="a1">
                <div class="circle">
                    <img class="sidebar-icon" data-src-light="icons/photoshop.png"  data-src-dark="icons/photoshop-dark.png" alt="photoshop">
                </div>
            </a>
        </div>
        <div class="bar">
            <a href="medibang.html" id="a2">
                <div class="circle">
                    <img class="sidebar-icon" data-src-light="icons/medibang.png" data-src-dark="icons/medibang-dark.png" alt="medibang">
                </div>
            </a>
        </div>
        <div class="bar">
            <a href="traditional.html" id="a3">
                <div class="circle">
                    <img class="sidebar-icon" data-src-light="icons/pencil.png" data-src-dark= "icons/pencil-dark.png" alt="pencil">
                </div>
            </a>
        </div>
        <div class="bar">
            <a id="darkModeToggle">
                <div class="circle">
                    <img class="sidebar-icon" data-src-light="icons/moon.png" data-src-dark="icons/moon-dark.png" alt="dark">
                </div>
            </a>
        </div>
    </div>

    <main>
        <div class="box">
            <div class="paragraph">
                <h3>Traditional drawing</h3>
                <p>
                    We will share our knoledge on the technics acompanying the process with you. 
                 You can specify your course in the field you are the most interested.
                <br>
                 Led by
                </p>
                <a href="signup.html" class="signup-button">Sign up</a>
            </div>
            <div class="slideshow-container">
                <div class="mySlides fade active">
                  <div class="numbertext">1 / 3</div>
                  <img src="img/pose.jpg" alt="Slide 1">
                </div>
                
                <div class="mySlides fade">
                  <div class="numbertext">2 / 3</div>
                  <img src="img/split.png" alt="Slide 2">
                </div>
                
                <div class="mySlides fade">
                  <div class="numbertext">3 / 3</div>
                  <img src="img/jinx.jpg" alt="Slide 3">
                </div>

                <a class="prev" onclick="plusSlides(-1)">❮</a>
                <a class="next" onclick="plusSlides(1)">❯</a>
                
                <br>
                
                <div class="dots">
                  <span class="dot active" onclick="currentSlide(1)"></span> 
                  <span class="dot"  onclick="currentSlide(2)"></span> 
                  <span class="dot" onclick="currentSlide(3)"></span> 
                </div>
            </div>    
        </div>
   </main>

   <footer>
        <span>CopyRight 2023. All Rights Reserved.
            <ul>
                <li><a href=""><i class="fa-brands fa-square-facebook"></i></a></li>
                <li><a href=""><i class="fa-brands fa-square-instagram"></i></a></li>
                <li><a href=""><i class="fa-brands fa-square-twitter"></i></a></li>
            </ul>
        </span>
    </footer>
    <script src="js/gallery.js">plusSlides(0);</script>
<script src="js/darkmode.js"></script>
</body>
</html>
