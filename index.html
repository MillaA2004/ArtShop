<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="shortcut icon" type="x-icon" href="icons/color-palette.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://kit.fontawesome.com/f634b05fd0.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="css/nav.css">
    <link rel="stylesheet" href="css/body.css">
    <link rel="stylesheet" href="css/footer.css">
    <link rel="stylesheet" href="css/sidebar.css">
    <link rel="stylesheet" href="css/gallery.css">
    <link rel="stylesheet" href="css/products.css">
    <link rel="stylesheet" href="css/dark-mode.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&display=swap" rel="stylesheet">
    <title>Artsy</title>
</head>
<body>
    <header>
        <nav>
            <ul>
                <li><a class="active" href="index.html">Store</a></li>
                <li><a href="aboutus.html">About us</a></li>  
                <li><a href="cart.html"><i class="fa fa-shopping-cart"></i></a></li>
                <li><a href="signup.html">Account</a></li>
            </ul>
        </nav> 
        <div class="logo">
            <a href="artsy.html">
                <img src="icons/color-palette.png" alt="logo">
            </a>
        </div>
    </header>
    
    <div id="sidenav" class="sidenav">
        <div class="bar">
            <a href="photoshop.html" id="a1">
                <div class="circle">
                    <img class="sidebar-icon" data-src-light="icons/photoshop.png" data-src-dark="icons/photoshop-dark.png" alt="photoshop">
                </div>
            </a>
        </div>
        <div class="bar">
            <a href="medibang.html" id="a2">
                <div class="circle">
                    <img class="sidebar-icon" data-src-light="icons/medibang.png" data-src-dark="icons/medibang-dark.png" alt="medibang">
                </div>
            </a>
        </div>
        <div class="bar">
            <a href="traditional.html" id="a3">
                <div class="circle">
                    <img class="sidebar-icon" data-src-light="icons/pencil.png" data-src-dark="icons/pencil-dark.png" alt="pencil">
                </div>
            </a>
        </div>
        <div class="bar">
            <a id="darkModeToggle">
                <div class="circle">
                    <img class="sidebar-icon" data-src-light="icons/moon.png" data-src-dark="icons/moon-dark.png" alt="dark">
                </div>
            </a>
        </div>
    </div>

    <main>
        <div class="product-container">
            <div class="filters-container">
                <p>Explore the world of art and creativity.</p>
                <div class="filters">
                    <label for="category">Category:</label>
                    <select id="category">
                        <option value="all">All</option>
                        <option value="digital art">Digital art</option>
                        <option value="traditional art">Traditional art</option>
                        <option value="software">Software</option>
                    </select>

                    <label for="sort">Sort by:</label>
                    <select id="sort">
                        <option value="name">Name</option>
                        <option value="price">Price</option>
                    </select>
                </div>
            </div>

            <div id="product-list" class="product-list"></div>
        </div>
    </main>

    <footer> 
        <span>CopyRight 2023. All Rights Reserved.
            <ul>
                <li><a href=""><i class="fa-brands fa-square-facebook"></i></a></li>
                <li><a href=""><i class="fa-brands fa-square-instagram"></i></a></li>
                <li><a href=""><i class="fa-brands fa-square-twitter"></i></a></li>
            </ul>
        </span>
    </footer>
    <script src="js/index.js"></script>
    <script src="js/logout.js"></script>
    <script src="js/darkmode.js"></script>
</body>
</html>
