  <main>
    <form action="/action_page.php" id="auth-form" style="border:1px solid #ccc">
      <div class="container">
        <h1 id="form-title">Sign In</h1>
        <p id="form-subtext">Please enter your credentials to sign in.</p>
        <hr>

        <label for="email"><b>Email</b></label>
        <input type="email" placeholder="Enter Email" name="email" id="email" required>

        <label for="psw"><b>Password</b></label>
        <input type="password" placeholder="Enter Password" name="psw" id="psw" required>

        <div id="confirm-password-container" style="display: none;">
          <label for="psw-repeat"><b>Repeat Password</b></label>
          <input type="password" placeholder="Repeat Password" name="psw-repeat" id="psw-repeat">
        </div>

        <label>
          <input type="checkbox" name="remember" checked="checked" style="margin-bottom:15px"> Remember me
        </label>

        <p>By continuing, you agree to our <a href="#">Terms & Privacy</a>.</p>

        <div class="clearfix">
          <button type="button" class="cancelbtn" onclick="window.location.href='index.html'">Cancel</button>
          <button type="submit" class="signupbtn" id="submit-button">Sign In</button>
        </div>

        <p style="text-align: center; margin-top: 1rem;" id="toggle-message">
          Don’t have an account?
          <a onclick="toggleForm()" class="form-toggle">Sign Up</a>
        </p>
      </div>
    </form>
  </main>
