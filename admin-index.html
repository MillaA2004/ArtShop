<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="shortcut icon" type="x-icon" href="icons/color-palette.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://kit.fontawesome.com/f634b05fd0.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="css/nav.css">
    <link rel="stylesheet" href="css/body.css">
    <link rel="stylesheet" href="css/footer.css">
    <link rel="stylesheet" href="css/sidebar.css">
    <link rel="stylesheet" href="css/gallery.css">
    <link rel="stylesheet" href="css/admin-index.css">
    <link rel="stylesheet" href="css/dark-mode.css">
    <title>Artsy</title>
</head>
<body>
    <header>
        <nav>
            <ul>
                <li><a class="active" href="admin-index.html">Store</a></li>
                <li><a href="admin-orders.html">Orders</a></li>
                <li><a href="admin-users.html">Users</a></li>
                <li><a href="logout.js">Log out</a></li>
            </ul>
        </nav> 
        <div class="logo">
                <img src="icons/color-palette.png" alt="logo">
        </div>
    </header>
    
<div id="sidenav" class="sidenav">
        <div class="bar">
            <a id="a3" onclick="">
                <div class="circle">
                    <p class="sidebar-icon" style="text-align: center; font-size: 2em; font-weight: 700;" data-src-light="style= color: black; fill-color: white;"  data-src-dark="style= color: white; fill-color: black;">+</p>
                </div>
            </a>
        </div>
        <div class="bar">
            <a id="darkModeToggle">
                <div class="circle">
                    <img class="sidebar-icon" data-src-light="icons/moon.png" data-src-dark="icons/moon-dark.png" alt="dark">
                </div>
            </a>
        </div>
    </div>

    <main>
         <div class="filters-container">
            <p>Explore the world of art and creativity.</p>

        <div class="filters">
            <label for="category">Category:</label>
            <select id="category">
                <option value="all">All</option>
                <option value="digital art">Digital art</option>
                <option value="traditional art">Traditional art</option>
                <option value="software">Software</option>
            </select>

            <label for="sort">Sort by:</label>
            <select id="sort">
                <option value="name">Name</option>
                <option value="price">Price</option>
            </select>
        </div>
        </div>

        <div id="product-list" class="product-list"></div>
    </main>
    <footer> 
        <span>CopyRight 2023. All Rights Reserved.
        <ul>
            <li><a href=""><i class="fa-brands fa-square-facebook"></i></a></li>
            <li><a href=""><i class="fa-brands fa-square-instagram"></i></a></li>
            <li><a href=""><i class="fa-brands fa-square-twitter"></i></a></li>
        </ul>
    </span>
    </footer>
    <script src="js/admin-index.js"></script>
    <script src="js/darkmode.js"></script>  

    <div id="popup-overlay" class="popup-overlay" style="display: none;">
        <div class="popup-form">
            <span id="close-popup" class="close-btn">&times;</span>
            <h3>Add New Product</h3>
            <form id="productForm">
                <label>Name:</label>
                <input type="text" id="name" required placeholder="e.g., Pose">

                <label>Price ($):</label>
                <input type="number" id="price" required placeholder="e.g., 30">

                <label>Category:</label>
                <br>
                <select id="category" required>
                    <option value="">Category</option>
                    <option value="digital art">Digital art</option>
                    <option value="traditional art">Traditional art</option>
                    <option value="software">Software</option>
                </select>
                <br>
                <label>Image URL:</label>
                <input type="text" id="image" required placeholder="e.g., img/shadows.jpg">

                <button type="submit">Add Product</button>
            </form>
        </div>
    </div>

    <script>
        // Open popup on click of the sidebar "+"
        document.querySelector('.sidenav #a3').addEventListener('click', (e) => {
            e.preventDefault();
            document.getElementById('popup-overlay').style.display = 'flex';
            // Sync popup dark mode with body
            const isDark = document.body.classList.contains('dark-mode');
            document.querySelector('.popup-form').classList.toggle('dark-mode', isDark);
        });

        // Close popup
        document.getElementById('close-popup').addEventListener('click', () => {
            document.getElementById('popup-overlay').style.display = 'none';
        });

        // Handle product form submission
        document.getElementById('productForm').addEventListener('submit', async function(event) {
            event.preventDefault();

            const product = {
                name: document.getElementById('name').value,
                price: parseFloat(document.getElementById('price').value),
                category: document.getElementById('category').value,
                image: document.getElementById('image').value
            };

            // TODO: Replace with real backend API call
            const res = await fetch('/api/products', {
                method: 'POST',
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(product)
            });

            if (res.ok) {
                alert('Product added successfully!');
                this.reset();
                document.getElementById('popup-overlay').style.display = 'none';
                if (typeof fetchProducts === "function") fetchProducts();
            } else {
                alert('Failed to add product.');
            }
        });

        // Optional: Update popup dark mode if theme changes while open
        document.getElementById('darkModeToggle').addEventListener('click', () => {
            const isDark = document.body.classList.contains('dark-mode');
            document.querySelector('.popup-form').classList.toggle('dark-mode', isDark);
        });
    </script>
</body>
</html>
