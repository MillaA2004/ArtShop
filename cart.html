<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="shortcut icon" type="x-icon" href="icons/color-palette.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://kit.fontawesome.com/f634b05fd0.js" crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/inputmask/5.0.8/inputmask.min.js"></script>
    <link rel="stylesheet" href="css/nav.css">
    <link rel="stylesheet" href="css/body.css">
    <link rel="stylesheet" href="css/footer.css">
    <link rel="stylesheet" href="css/sidebar.css">
    <link rel="stylesheet" href="css/cart.css">
    <link rel="stylesheet" href="css/dark-mode.css">
    <title>Artsy</title>
    <style>
      #cart-preview img { border: 1px solid #ccc; }
  </style>
</head>
<body>
  <header>
        <nav>
            <ul>
                <li><a href="index.html">Store</a></li>
                <li><a href="signup.html">Account</a></li>
                <li><a href="aboutus.html">About us</a></li>  
                <li><a class="active" href="cart.html"><i class="fa fa-shopping-cart"></i></a></li>
            </ul>
        </nav> 
        <div class="logo">
            <a href="artsy.html">
                <img src="icons/color-palette.png"  alt="logo">
            </a>
        </div>
    </header>

    
  <div id="sidenav" class="sidenav">
        <div class="bar">
            <a href="photoshop.html" id="a1">
                <div class="circle">
                    <img class="sidebar-icon" data-src-light="icons/photoshop.png"  data-src-dark="icons/photoshop-dark.png" alt="photoshop">
                </div>
            </a>
        </div>
        <div class="bar">
            <a href="medibang.html" id="a2">
                <div class="circle">
                    <img class="sidebar-icon" data-src-light="icons/medibang.png" data-src-dark="icons/medibang-dark.png" alt="medibang">
                </div>
            </a>
        </div>
        <div class="bar">
            <a href="traditional.html" id="a3">
                <div class="circle">
                    <img class="sidebar-icon" data-src-light="icons/pencil.png" data-src-dark= "icons/pencil-dark.png" alt="pencil">
                </div>
            </a>
        </div>
        <div class="bar">
            <a id="darkModeToggle">
                <div class="circle">
                    <img class="sidebar-icon" data-src-light="icons/moon.png" data-src-dark="icons/moon-dark.png" alt="dark">
                </div>
            </a>
        </div>
    </div>

  <main>
       <div class="row">
      <div class="col-75">
        <div class="box">
          <form action="/action_page.php">

            <div class="row">
              <div class="col-50">
                <h3>Billing Address</h3>
                <label for="fname"><i class="fa fa-user"></i> Full Name</label>
                <input type="text" id="fname" name="firstname" placeholder="John M. Doe">
                <label for="email"><i class="fa fa-envelope"></i> Email</label>
                <input type="email" id="email" name="email" placeholder="john@example.com">
                <label for="adr"><i class="fa fa-address-card-o"></i> Address</label>
                <input type="text" id="adr" name="address" placeholder="Aleko 15th Street">
                <label for="city"><i class="fa fa-institution"></i> City</label>
                <input type="text" id="city" name="city" placeholder="Sofia">

                <div class="row">
                  <div class="col-50">
                    <label for="state">Province</label>
                    <input type="text" id="state" name="state" placeholder="Sofia-Province">
                  </div>
                  <div class="col-50">
                    <label for="zip">Zip</label>
                    <input type="text" id="zip" name="zip" placeholder="1000">
                  </div>
                </div>
              </div>

              <div class="col-50">
                <h3>Payment</h3>
                <label for="fname">Accepted Cards</label>
                <div class="icon-container">
                  <i class="fa fa-cc-visa"></i>
                  <i class="fa fa-cc-amex"></i>
                  <i class="fa fa-cc-mastercard"></i>
                  <i class="fa fa-cc-discover"></i>
                </div>
                <label for="cname">Name on Card</label>
                <input type="text" id="cname" name="cardname" placeholder="John More Doe">
                <label for="ccnum">Credit card number</label>
                <input type="text" id="ccnum" name="cardnumber" placeholder="xxxx-xxxx-xxxx-xxxx">
                <label for="expmonth">Exp Month</label>
                <input type="text" id="expmonth" name="expmonth" placeholder="September">

                <div class="row">
                  <div class="col-50">
                    <label for="expyear">Exp Year</label>
                    <input type="text" id="expyear" name="expyear" placeholder="2018">
                  </div>
                  <div class="col-50">
                    <label for="cvv">CVV</label>
                    <input type="text" id="cvv" name="cvv" placeholder="352">
                  </div>
                </div>
              </div>

            </div>
            <label>
  <input type="checkbox" id="same-address" checked> Shipping address same as billing
    </label>
            <div id="shipping-address" style="display: none; margin-top: 20px;">
              <h3>Shipping Address</h3>
              <label for="shipping-name">Full Name</label>
              <input type="text" id="shipping-name" name="shippingname" placeholder="Jane Smith">

              <label for="shipping-email">Email</label>
              <input type="email" id="shipping-email" name="shippingemail" placeholder="jane@example.com">

              <label for="shipping-street">Address</label>
              <input type="text" id="shipping-street" name="shippingaddress" placeholder="123 Main St">

              <label for="shipping-city">City</label>
              <input type="text" id="shipping-city" name="shippingcity" placeholder="City">

              <label for="shipping-zip">ZIP / Postal Code</label>
              <input type="text" id="shipping-zip" name="shippingzip" placeholder="ZIP">
            </div> 
          </form>
        </div>
      </div>

      <div class="col-25">
        <div class="container" id="box">
            <h4>Cart
              <span class="price">
                <i class="fa fa-shopping-cart"></i>
                <span id="cart-count" class="cart-count">0</span>
              </span>
            </h4>
              <div id="cart-preview" style="margin-bottom: 10px;"></div>

              <hr>
              <br>

              <p>Total <span class="price"><b id="total-price">$0</b></span></p>

              <button id="clear-cart" class="btn">Clear Cart</button>

              <input type="submit" value="Continue to checkout" class="btn" id="checkout-btn">
          </div>
      </div>
    </div>
  </main>

  <footer>
        <span>CopyRight 2023. All Rights Reserved.
            <ul>
                <li><a class="footer" href=""><i class="fa-brands fa-square-facebook"></i></a></li>
                <li><a class="footer" href=""><i class="fa-brands fa-square-instagram"></i></a></li>
                <li><a class="footer" href=""><i class="fa-brands fa-square-twitter"></i></a></li>
            </ul>
        </span>
    </footer>

    <div id="toast" style="
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: #333;
      color: #fff;
      padding: 12px 20px;
      border-radius: 6px;
      display: none;
      font-family: sans-serif;
      z-index: 999;
      box-shadow: 0 0 10px rgba(0,0,0,0.2);
    ">
    </div>

  <script src="js/cart.js"></script>
  <script src="js/darkmode.js"></script>
  <script>
      document.addEventListener("DOMContentLoaded", () => {
      const sameAddressCheckbox = document.getElementById("same-address");
      const shippingAddressSection = document.getElementById("shipping-address");

      sameAddressCheckbox.addEventListener("change", () => {
        shippingAddressSection.style.display = sameAddressCheckbox.checked ? "none" : "block";
      });
    });
  </script>
</body>
</html>
